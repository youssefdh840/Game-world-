<!doctype html>
<html lang="en" class="dark" style="background-color: #0B0F19; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mapia: World Challenge</title>
    <meta name="description" content="A social multiplayer mobile game to meet people from around the world and play cultural mini-games." />
    <meta property="og:title" content="Mapia: World Challenge" />
    <meta property="og:description" content="A social multiplayer mobile game to meet people from around the world and play cultural mini-games." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <style>
      html, body {
        background-color: #0B0F19;
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
        width: 100%;
        -webkit-tap-highlight-color: transparent;
        touch-action: pan-y;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        background-color: #0B0F19;
        min-height: 100%;
        min-height: 100dvh;
        width: 100%;
        touch-action: pan-y;
      }
      html.theme-black, html.theme-black body, html.theme-black #root {
        background-color: #000000 !important;
        color: #FFFFFF !important;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mapia_theme');
          var isBlack = saved === 'black' || saved === 'pure_black';
          var root = document.documentElement;
          root.classList.add('dark');
          root.classList.remove('light');
          root.style.colorScheme = 'dark';
          if (isBlack) {
            root.classList.add('theme-black');
            root.classList.remove('theme-navy');
            root.style.backgroundColor = '#000000';
          } else {
            root.classList.add('theme-navy');
            root.classList.remove('theme-black');
            root.style.backgroundColor = '#0B0F19';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0B0F19] text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
